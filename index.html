<meta charset="utf-8">
<title>Energía Odyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Elyos / Abyss theme. Dark by design in both color schemes: the 3D canvas sits behind
     everything, cards are dark glass. Orbs are drawn by the canvas inside each .orb-slot,
     so slots have no background of their own. */
  :root {
    --bg: #050914;
    --bg-2: #0c1630;
    --glass: rgba(14, 20, 38, .62);
    --glass-strong: rgba(14, 20, 38, .82);
    --fg: #f3ecdc;
    --muted: #a9b3c8;
    --line: rgba(232, 184, 90, .28);
    --gold: #e8b85a;
    --gold-bright: #ffd98a;
    --sky: #7cc8ff;
    --on-gold: #1a1205;
    --danger: #ff8f7a;
    --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(120% 80% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%) fixed;
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.45;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }
  .page {
    position: relative; z-index: 1;
    max-width: 960px; margin-inline: auto;
    padding: 28px 16px 56px;
    display: flex; flex-direction: column; gap: 24px;
  }

  /* ---- Header with live countdown ---- */
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
  h1 {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.05; margin: 0;
    letter-spacing: .04em; color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(232, 184, 90, .45);
  }
  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: .875rem; letter-spacing: .08em; text-transform: uppercase; }
  .clock { display: flex; align-items: center; gap: 12px; }
  .ring { width: 56px; height: 56px; flex: none; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: rgba(124, 200, 255, .15); }
  .ring .arc { stroke: var(--sky); stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(124, 200, 255, .7)); }
  .clock-label { margin: 0; color: var(--muted); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
  .clock-time { margin: 0; font-size: 1.5rem; font-weight: 600; color: var(--sky); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .clock.missing .clock-time { font-size: 1rem; color: var(--muted); }
  .clock.missing .ring { display: none; }

  /* ---- Controls ---- */
  button, input, select { font: inherit; color: inherit; }
  button {
    position: relative; overflow: hidden;
    cursor: pointer; border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: .875rem;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .03); min-height: 40px;
    transition: border-color .2s, background-color .2s, transform .15s;
  }
  button:hover { border-color: var(--gold); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: var(--on-gold); border-color: var(--gold);
    box-shadow: 0 0 14px rgba(232, 184, 90, .25);
  }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  input, select {
    background: rgba(5, 9, 20, .7); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; min-height: 40px; min-width: 0; width: 100%;
  }
  select option { background: #0c1630; color: var(--fg); }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); }
  label { font-size: .8125rem; font-weight: 500; color: var(--muted); }
  .error { margin: 0; color: var(--danger); font-size: .8125rem; font-weight: 500; }

  .panel {
    background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; line-height: 1.2; margin: 0; letter-spacing: .03em; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .row .field { flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row .offset { margin-top: 22px; }

  /* ---- Character cards: orb (canvas-drawn) + glass panel ---- */
  .grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 860px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { display: grid; grid-template-columns: 1fr; justify-items: center; gap: 0; position: relative; }
  .orb-col { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 8px; z-index: 2; }
  .orb-slot { width: 150px; height: 150px; position: relative; }
  .tick-left { margin: 0; font-size: .8rem; font-weight: 600; color: var(--sky); font-variant-numeric: tabular-nums;
    letter-spacing: .03em; text-shadow: 0 0 8px rgba(124, 200, 255, .6); white-space: nowrap; }
  .tick-left.full { color: var(--gold-bright); text-shadow: 0 0 8px rgba(255, 217, 138, .6); }
  .tick-left.missing { color: var(--muted); text-shadow: none; font-weight: 500; }
  .card .panel { width: 100%; }
  @media (min-width: 520px) {
    .card { grid-template-columns: 150px minmax(0, 1fr); align-items: center; justify-items: stretch; }
    .orb-col { margin: 0 -26px 0 0; }
    .card .panel { padding: 16px 16px 16px 40px; }
  }
  .card-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cls-icon { width: 26px; height: 26px; flex: none; fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 4px var(--c)); }
  .name { min-width: 0; overflow-wrap: anywhere; }
  .cls-name { margin: 0; color: var(--c); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; }
  .energy { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
  .energy .num { font-size: 2.1rem; font-weight: 600; line-height: 1; color: var(--gold-bright); text-shadow: 0 0 12px rgba(232, 184, 90, .35); }
  .energy small { color: var(--muted); font-size: .9rem; }
  .badge { margin-left: auto; align-self: center; font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--on-gold); background: var(--gold-bright); border-radius: 999px; padding: 3px 10px; }
  .full-in { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .full-at { margin: 0; color: var(--muted); font-size: .8125rem; }
  .info { display: flex; flex-direction: column; gap: 2px; }
  .confirm-text { margin: 0; color: var(--danger); font-size: .875rem; font-weight: 500; }
  .card.full .panel { border-color: var(--gold-bright); box-shadow: 0 0 24px rgba(255, 217, 138, .28), inset 0 0 18px rgba(255, 217, 138, .08); }
  .card.near .panel { border-color: var(--gold); }

  /* Flat orb: used when there is no WebGL or the system asks for reduced motion. */
  .orb-flat { display: none; position: absolute; inset: 14px; border-radius: 50%;
    border: 2px solid var(--gold);
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 30%),
      linear-gradient(to top, color-mix(in srgb, var(--c) 70%, var(--gold)) var(--fill), rgba(12, 22, 48, .85) var(--fill));
    box-shadow: 0 0 18px rgba(232, 184, 90, .35), inset 0 0 14px rgba(0, 0, 0, .5); }
  body.flat .orb-flat { display: block; }
  body.flat #scene { display: none; }

  .gain {
    position: absolute; z-index: 3; left: 75px; top: 20px; transform: translateX(-50%);
    font-weight: 700; font-size: 1.4rem; color: var(--gold-bright); pointer-events: none;
    text-shadow: 0 0 10px rgba(255, 217, 138, .9);
  }
  @media (max-width: 519px) { .gain { left: 50%; } }

  .empty {
    border: 1px dashed var(--line); border-radius: 16px; padding: 24px 16px; text-align: center; margin: 0;
    font-weight: 500; font-size: 1rem; background: var(--glass);
  }

  /* ---- Motion (only when allowed) ---- */
  @media (prefers-reduced-motion: no-preference) {
    .card.enter { animation: rise .6s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 90ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .card .panel { transition: transform .25s ease, box-shadow .25s ease, border-color .25s; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
    .card.near .panel { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 rgba(232, 184, 90, 0); }
      50% { box-shadow: 0 0 22px rgba(232, 184, 90, .45); border-color: var(--gold-bright); }
    }
    .gain { animation: float 1.6s ease-out forwards; }
    @keyframes float {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); }
      20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -40px) scale(1); }
    }
    button.primary::after {
      content: ""; position: absolute; inset: 0; transform: translateX(-120%);
      background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .55) 50%, transparent 70%);
    }
    button.primary:hover::after { transition: transform .7s ease; transform: translateX(120%); }
    .ring .arc { transition: stroke-dashoffset 1s linear; }
  }
</style>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="page">
  <header>
    <div>
      <h1>Energía Odyle</h1>
      <p class="subtitle">Daevas de Elyos</p>
    </div>
    <div class="clock" id="clock">
      <svg class="ring" viewBox="0 0 60 60" aria-hidden="true">
        <circle class="track" cx="30" cy="30" r="26"></circle>
        <circle class="arc" id="ring-arc" cx="30" cy="30" r="26" stroke-dasharray="163.36" stroke-dashoffset="0"></circle>
      </svg>
      <div>
        <p class="clock-label">Próxima recarga</p>
        <p class="clock-time" id="next-tick"></p>
      </div>
    </div>
    <button type="button" id="adjust-toggle">Ajustar recarga</button>
    <button type="button" id="motion-btn" hidden>Activar movimiento</button>
  </header>
  <form class="panel" id="adjust-form" hidden novalidate>
    <h2>Ajustar recarga</h2>
    <div class="row">
      <div class="field">
        <label for="adjust-minutes">Minutos que faltan para la próxima recarga</label>
        <input id="adjust-minutes" inputmode="numeric" autocomplete="off" placeholder="1 a 180">
        <p class="error" id="adjust-error" role="alert" hidden></p>
      </div>
      <button type="submit" class="primary offset">Guardar</button>
      <button type="button" id="adjust-cancel" class="offset">Cancelar</button>
    </div>
  </form>

  <p class="empty" id="nodata" hidden>No se pueden cargar los datos aquí</p>
  <p class="error" id="notice" role="alert" hidden></p>
  <section class="grid" id="cards" aria-label="Personajes"></section>
  <p class="empty" id="empty" hidden>Aún no hay personajes. Añade el primero.</p>

  <form class="panel" id="add-form" novalidate>
    <h2>Añadir personaje</h2>
    <div class="row">
      <div class="field">
        <label for="add-name">Nombre</label>
        <input id="add-name" maxlength="60" autocomplete="off" placeholder="Máximo 24 caracteres">
        <p class="error" id="add-error" role="alert" hidden></p>
      </div>
      <div class="field">
        <label for="add-class">Clase</label>
        <select id="add-class"></select>
      </div>
      <button type="submit" class="primary offset">Añadir</button>
    </div>
  </form>
</div>

<script type="module">
  import { buildView, parseEnergyInput, parseMinutesInput, parseNameInput, parseClassInput } from './view.js';
  import { anchorFromCountdown, formatDuration, nextTickAt, TICK_MS, MAX } from './energy.js';
  import { CLASSES, classById } from './classes.js';
  import { formatClock, detectGains, rollValue, becameFull, sceneOptions } from './motion.js';

  // Data comes only from db snapshots. Writes happen only after a user action.
  const state = { characters: [], schedule: null };
  // Interface-only state: which card is editing/confirming, validation messages.
  // noDb: no db in this view. readOnly: viewer cannot write (or a write was refused).
  const ui = { adjustOpen: false, editingId: null, confirmId: null, errors: {}, noDb: false, readOnly: false, loaded: false };

  let db = null;
  let user = null;

  // ---- Motion setup: the 3D scene loads in the background; flat orbs until it is ready ----
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let scene = null;
  let animate = false;
  document.body.classList.add('flat');
  async function initScene() {
    if (reduceMotion) return;
    try {
      const { createScene } = await import('./orb.js');
      scene = createScene(document.getElementById('scene'), sceneOptions(innerWidth));
    } catch { scene = null; }
    if (!scene) return;
    animate = true;
    document.body.classList.remove('flat');
    scene.start();
    enableTilt();
    enableOrientation();
    render();
  }

  // ---- Actions (the only functions that write data), one write at a time ----
  let queue = Promise.resolve();
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function write(fn) {
    const run = queue.then(async () => {
      try { await fn(); }
      catch (e) {
        if (e && e.code === 'unavailable') { await sleep(500 + Math.random() * 1000); await fn(); }
        else throw e;
      }
    });
    queue = run.catch(() => {});
    return run;
  }
  // Returns true on success; on failure shows the notice (or goes read-only).
  // targetId: document being updated/deleted; if it is gone, invalid_argument is not a permission refusal.
  async function save(fn, targetId = null) {
    showNotice('');
    try { await write(fn); return true; }
    catch (e) {
      const gone = targetId !== null && !state.characters.some(c => c.id === targetId);
      if (e && e.code === 'invalid_argument' && !gone) { ui.readOnly = true; showNotice('No tienes permiso para editar. Solo lectura.'); }
      else showNotice('No se pudo guardar');
      render();
      return false;
    }
  }
  // The ref is minted once so a retried set cannot create a duplicate.
  const addCharacter = (name, classId) => {
    if (!db) { showNotice('No se pudo guardar'); return Promise.resolve(false); }
    const ref = db.collection('characters').doc();
    const data = {
      name, classId, energy: 0, recordedAt: Date.now(),
      order: Math.max(0, ...state.characters.map(c => Number(c.order) || 0)) + 1,
    };
    return save(() => ref.set(data));
  };
  const updateCharacter = (id, value, classId) =>
    save(() => db.doc('characters/' + id).update({ energy: value, recordedAt: Date.now(), classId }), id);
  const resyncTick = minutes => save(() => db.doc('settings/schedule').set({ anchorMs: anchorFromCountdown(Date.now(), minutes) }));
  const removeCharacter = id => save(() => db.doc('characters/' + id).delete(), id);

  // ---- Rendering ----
  const $ = id => document.getElementById(id);
  const dateFmt = new Intl.DateTimeFormat('es', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function el(tag, props = {}, ...kids) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v === true) node.setAttribute(k, '');
      else if (v !== false && v != null) node.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) node.append(kid);
    return node;
  }
  function classIcon(cls) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('class', 'cls-icon'); svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS(SVG_NS, 'path'); path.setAttribute('d', cls.icon);
    svg.append(path);
    return svg;
  }
  function classSelect(id, selected) {
    const sel = el('select', { id });
    sel.append(el('option', { value: '' }, 'Sin clase'));
    for (const c of CLASSES) sel.append(el('option', { value: c.id, selected: c.id === selected }, c.name));
    return sel;
  }
  function showError(id, msg) {
    const p = $(id);
    p.textContent = msg || '';
    p.hidden = !msg;
  }
  function showNotice(msg) { showError('notice', msg); }
  function errorLine(id, msg) {
    return el('p', { class: 'error', id, role: 'alert' }, msg);
  }

  // Number roll: what each card currently shows, and running rolls.
  const shown = new Map();
  const rolls = new Map();
  let rollRaf = 0;
  function stepRolls(now) {
    for (const [id, r] of rolls) {
      const t = (now - r.start) / 600;
      const v = rollValue(r.from, r.to, t);
      shown.set(id, v);
      const node = document.querySelector(`[data-num="${CSS.escape(id)}"]`);
      if (node) node.textContent = String(v);
      if (t >= 1) rolls.delete(id);
    }
    rollRaf = rolls.size ? requestAnimationFrame(stepRolls) : 0;
  }
  function startRoll(id, from, to) {
    rolls.set(id, { from, to, start: performance.now() });
    if (!rollRaf) rollRaf = requestAnimationFrame(stepRolls);
  }

  const seen = new Set();

  function cardNode(row, index) {
    const editing = ui.editingId === row.id;
    const confirming = ui.confirmId === row.id;
    const err = ui.errors[row.id];
    const cls = classById(row.classId);
    const mood = row.isFull ? 'full' : row.nearFull ? 'near' : '';
    const fresh = !seen.has(row.id);
    seen.add(row.id);
    const card = el('article', { class: `card ${mood} ${fresh && animate ? 'enter' : ''}`, 'data-id': row.id,
      style: `--c:${row.color};--i:${index}` });

    card.append(el('div', { class: 'orb-col' },
      el('div', { class: 'orb-slot', 'data-orb': row.id, role: 'img', 'aria-label': `${row.percent}% de energía` },
        el('div', { class: 'orb-flat', style: `--fill:${row.percent}%` })),
      el('p', { class: 'tick-left', 'data-full': row.isFull ? '1' : null })));

    const panel = el('div', { class: 'panel' });
    const head = el('div', { class: 'card-head' });
    if (cls) head.append(classIcon(cls));
    head.append(el('div', {}, el('h2', { class: 'name' }, row.name), cls ? el('p', { class: 'cls-name' }, cls.name) : null));
    panel.append(head);

    const prevShown = shown.get(row.id);
    const rolling = animate && prevShown !== undefined && prevShown !== row.energy;
    const display = rolling ? (rolls.has(row.id) ? shown.get(row.id) : prevShown) : row.energy;
    if (rolling) startRoll(row.id, display, row.energy); else { rolls.delete(row.id); shown.set(row.id, row.energy); }
    panel.append(el('div', { class: 'energy' },
      el('span', { class: 'num', 'data-num': row.id }, String(display)),
      el('small', {}, `/ ${row.max}`),
      row.isFull ? el('span', { class: 'badge' }, 'Lleno') : null));

    const info = el('div', { class: 'info' });
    info.append(el('p', { class: 'full-in' }, row.isFull ? 'Energía al máximo' : (row.fullAtMs === null ? row.fullInText : `Lleno en ${row.fullInText}`)));
    if (row.fullAtMs !== null) info.append(el('p', { class: 'full-at' }, dateFmt.format(new Date(row.fullAtMs))));
    panel.append(info);

    if (ui.readOnly || ui.noDb) {
      // read-only or stale: no edit controls
    } else if (editing) {
      const inputId = `energy-${row.id}`;
      const classId = `class-${row.id}`;
      const form = el('form', { novalidate: true, onsubmit: async e => {
        e.preventDefault();
        const r = parseEnergyInput($(inputId).value);
        if (!r.ok) { ui.errors[row.id] = r.error; return render(); }
        const c = parseClassInput($(classId).value);
        if (!c.ok) { ui.errors[row.id] = c.error; return render(); }
        if (!await updateCharacter(row.id, r.value, c.value)) return;
        ui.editingId = null; delete ui.errors[row.id]; render();
      } });
      const field = el('div', { class: 'field' },
        el('label', { for: inputId }, 'Energía actual'),
        el('input', { id: inputId, inputmode: 'numeric', autocomplete: 'off', value: String(row.energy),
          'aria-invalid': err ? 'true' : 'false', 'aria-describedby': err ? `err-${row.id}` : null }));
      if (err) field.append(errorLine(`err-${row.id}`, err));
      form.append(el('div', { class: 'row' }, field,
        el('div', { class: 'field' }, el('label', { for: classId }, 'Clase'), classSelect(classId, row.classId))));
      form.append(el('div', { class: 'row' },
        el('button', { type: 'submit', class: 'primary' }, 'Guardar'),
        el('button', { type: 'button',
          onclick: () => { ui.editingId = null; delete ui.errors[row.id]; render(); } }, 'Cancelar')));
      panel.append(form);
    } else if (confirming) {
      panel.append(el('p', { class: 'confirm-text' }, `¿Quitar a ${row.name}?`));
      panel.append(el('div', { class: 'row' },
        el('button', { type: 'button', class: 'danger', onclick: async () => { if (!await removeCharacter(row.id)) return; ui.confirmId = null; render(); } }, 'Sí, quitar'),
        el('button', { type: 'button', onclick: () => { ui.confirmId = null; render(); } }, 'Cancelar')));
    } else {
      panel.append(el('div', { class: 'row' },
        el('button', { type: 'button', class: 'primary', onclick: () => { ui.editingId = row.id; ui.confirmId = null; render(); $('energy-' + row.id)?.select(); } }, 'Actualizar'),
        el('button', { type: 'button', onclick: () => { ui.confirmId = row.id; ui.editingId = null; render(); } }, 'Quitar')));
    }
    card.append(panel);
    return card;
  }

  // Header clock: text + ring every second, no data work.
  // Also the per-card rune timers ("+15 en hh:mm:ss") and the rune ring progress.
  let orbList = [];
  function paintClock() {
    const anchor = state.schedule && Number.isFinite(state.schedule.anchorMs) ? state.schedule.anchorMs : null;
    const left = anchor === null ? null : nextTickAt(anchor, Date.now()) - Date.now();
    for (const p of document.querySelectorAll('.tick-left')) {
      const full = p.dataset.full === '1';
      p.classList.toggle('full', full);
      p.classList.toggle('missing', !full && anchor === null);
      p.textContent = full ? 'Lleno' : anchor === null ? 'Falta la hora de recarga' : `+15 en ${formatClock(left)}`;
    }
    for (const o of orbList) o.tick = left === null ? null : 1 - left / TICK_MS;
    $('clock').classList.toggle('missing', anchor === null);
    if (anchor === null) { $('next-tick').textContent = 'Falta la hora de recarga'; return; }
    $('next-tick').textContent = formatClock(left);
    $('next-tick').setAttribute('aria-label', `en ${formatDuration(left)}`);
    $('ring-arc').setAttribute('stroke-dashoffset', String(163.36 * (1 - left / TICK_MS)));
  }

  let lastEnergy = new Map();
  let lastAnchor;
  function paint(view) {
    const anchor = state.schedule && Number.isFinite(state.schedule.anchorMs) ? state.schedule.anchorMs : null;
    // A schedule change (incl. first load) moves computed energy without a recharge: re-baseline, no roll.
    if (anchor !== lastAnchor) { shown.clear(); rolls.clear(); }
    paintClock();
    const locked = ui.noDb || ui.readOnly;
    $('nodata').hidden = !ui.noDb;
    $('adjust-toggle').hidden = locked || !db;
    $('add-form').hidden = locked || !ui.loaded;
    $('clock').hidden = ui.noDb;
    $('adjust-form').hidden = locked || !ui.adjustOpen;
    $('adjust-toggle').setAttribute('aria-expanded', String(ui.adjustOpen));

    // Keep focus and caret across repaints (timers repaint too).
    const active = document.activeElement;
    const focusId = active && active.id ? active.id : null;
    const caret = focusId && 'selectionStart' in active ? [active.selectionStart, active.selectionEnd] : null;

    const cards = $('cards');
    const draft = new Map();
    for (const input of cards.querySelectorAll('input, select')) draft.set(input.id, input.value);
    cards.replaceChildren(...view.rows.map(cardNode));
    for (const input of cards.querySelectorAll('input, select')) if (draft.has(input.id)) input.value = draft.get(input.id);
    $('empty').hidden = ui.noDb || view.rows.length > 0 || !ui.loaded;
    $('empty').textContent = ui.readOnly ? 'Aún no hay personajes.' : 'Aún no hay personajes. Añade el primero.';
    cards.hidden = view.rows.length === 0;

    orbList = view.rows.map(r => ({
      id: r.id, el: cards.querySelector(`[data-orb="${CSS.escape(r.id)}"]`), tick: null,
      percent: r.percent, color: r.color, state: r.isFull ? 'full' : r.nearFull ? 'near' : 'normal',
    }));
    paintClock(); // fills the new cards' timers and the orbs' rune progress
    if (scene) scene.setOrbs(orbList);

    // Recharge gains (not manual edits): floating "+N" and an orb ripple.
    const recorded = new Map(state.characters.map(c => [c.id, c.recordedAt]));
    const now = view.rows.map(r => ({ id: r.id, energy: r.energy, recordedAt: recorded.get(r.id), anchorMs: anchor }));
    // While hidden, keep the old baseline so returning shows one "+N" with the total.
    const keepBaseline = document.hidden && anchor === lastAnchor;
    if (animate && !keepBaseline) {
      for (const g of detectGains(lastEnergy, now)) {
        const card = cards.querySelector(`article[data-id="${CSS.escape(g.id)}"]`);
        if (card) card.append(el('span', { class: 'gain', 'aria-hidden': 'true' }, `+${g.gain}`));
        scene.ripple(g.id);
      }
      if (anchor === lastAnchor) for (const id of becameFull(lastEnergy, now, MAX)) scene.beam(id);
    }
    if (!keepBaseline) lastEnergy = new Map(now.map(r => [r.id, r]));
    lastAnchor = anchor;

    if (focusId && document.activeElement !== $(focusId)) {
      const again = $(focusId);
      if (again) { again.focus(); if (caret && again.setSelectionRange) again.setSelectionRange(caret[0], caret[1]); }
    }
  }

  function render() {
    paint(buildView(state.characters, state.schedule, Date.now()));
  }

  // ---- Events ----
  $('add-class').replaceWith(classSelect('add-class', null));
  $('adjust-toggle').addEventListener('click', () => {
    ui.adjustOpen = !ui.adjustOpen;
    showError('adjust-error', '');
    render();
    if (ui.adjustOpen) $('adjust-minutes').focus();
  });
  $('adjust-cancel').addEventListener('click', () => { ui.adjustOpen = false; showError('adjust-error', ''); render(); });
  $('adjust-form').addEventListener('submit', async e => {
    e.preventDefault();
    const r = parseMinutesInput($('adjust-minutes').value);
    $('adjust-minutes').setAttribute('aria-invalid', String(!r.ok));
    if (!r.ok) return showError('adjust-error', r.error);
    showError('adjust-error', '');
    if (!await resyncTick(r.value)) return;
    $('adjust-minutes').value = '';
    ui.adjustOpen = false;
    render();
  });
  $('add-form').addEventListener('submit', async e => {
    e.preventDefault();
    const r = parseNameInput($('add-name').value);
    $('add-name').setAttribute('aria-invalid', String(!r.ok));
    if (!r.ok) return showError('add-error', r.error);
    const c = parseClassInput($('add-class').value);
    if (!c.ok) return showError('add-error', c.error);
    showError('add-error', '');
    if (!await addCharacter(r.value, c.value)) return;
    $('add-name').value = '';
    $('add-class').value = '';
    render();
  });
  // Phones: orbs follow the device's tilt. iOS needs a tap to grant permission.
  function enableOrientation() {
    if (!matchMedia('(pointer: coarse)').matches || !window.DeviceOrientationEvent) return;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      $('motion-btn').hidden = false;
      $('motion-btn').addEventListener('click', async () => {
        if (await scene.enableOrientation()) { $('motion-btn').hidden = true; return; }
        // Denied: iOS won't ask again, so don't leave a button that does nothing.
        $('motion-btn').disabled = true;
        $('motion-btn').textContent = 'Movimiento no disponible';
      });
    } else scene.enableOrientation();
  }

  // Gentle tilt on hover (fine pointers only); delegated because cards are re-created.
  function enableTilt() {
    if (!matchMedia('(pointer: fine)').matches) return;
    $('cards').addEventListener('pointermove', e => {
      const panel = e.target.closest('.card .panel');
      if (!panel) return;
      const r = panel.getBoundingClientRect();
      panel.style.setProperty('--ry', `${((e.clientX - r.left) / r.width - .5) * 5}deg`);
      panel.style.setProperty('--rx', `${-((e.clientY - r.top) / r.height - .5) * 5}deg`);
    });
    $('cards').addEventListener('pointerout', e => {
      const panel = e.target.closest('.card .panel');
      if (panel && !panel.contains(e.relatedTarget)) { panel.style.removeProperty('--rx'); panel.style.removeProperty('--ry'); }
    });
  }

  render();
  initScene();
  // Timers only repaint from memory; they never write.
  let nextRepaintAt = Infinity;
  setInterval(() => {
    paintClock();
    const anchor = state.schedule?.anchorMs;
    if (Number.isFinite(anchor)) {
      const due = nextTickAt(anchor, Date.now() - 1000);
      if (Date.now() >= due && due !== nextRepaintAt) { nextRepaintAt = due; render(); }
    }
  }, 1000);
  setInterval(render, 30_000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  // ---- Connect to db (one subscription each, never from render) ----
  try {
    db = await window.claude.use('db');
    user = await window.claude.use('user');
  } catch { db = null; }
  if (!db) {
    ui.noDb = true; ui.loaded = true;
    render();
  } else {
    try { if (user && (await user.can('data.write')) === false) ui.readOnly = true; } catch {}
    render();
    const onError = () => { ui.noDb = true; ui.loaded = true; render(); };
    db.collection('characters').onSnapshot(snap => {
      state.characters = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      ui.loaded = true;
      render();
    }, onError);
    db.doc('settings/schedule').onSnapshot(snap => {
      state.schedule = snap.exists ? snap.data() : null;
      render();
    }, onError);
  }
</script>
