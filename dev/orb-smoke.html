<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#070b18;min-height:200vh}.slot{position:absolute;width:140px;height:140px}</style>
<canvas id="c" style="position:fixed;inset:0;width:100%;height:100%"></canvas>
<div class="slot" id="s1" style="left:40px;top:60px"></div>
<div class="slot" id="s2" style="left:220px;top:60px"></div>
<div class="slot" id="s3" style="left:400px;top:60px"></div>
<script type="module">
import { createScene } from '../orb.js';
const scene = createScene(document.getElementById('c'), { particles: 200 });
window.__scene = !!scene;
if (scene) {
  scene.setOrbs([
    { id: 'a', el: document.getElementById('s1'), percent: 26, color: '#b79cff', state: 'normal', tick: null },
    { id: 'b', el: document.getElementById('s2'), percent: 41, color: '#e0924a', state: 'normal', tick: 0 },
    { id: 'c', el: document.getElementById('s3'), percent: 41, color: '#e0924a', state: 'normal', tick: 0.95 },
  ]);
  scene.start();
  window.__scn = scene;
  setTimeout(() => scene.ripple('a'), 300);
}
</script>
